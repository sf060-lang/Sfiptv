name: Build IPTV Pro

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - name: APK (tek dosya, tum cihazlar)
        run: flutter build apk --release
      - name: APK (mimariye ozel, daha kucuk)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-Android
          path: build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Visual C++ calisma zamani DLL'lerini ekle
        run: |
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" build/windows/x64/runner/Release/ || true
          done
      - name: ZIP (kurulumsuz, tasinabilir)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/IPTVPro-Windows-portable.zip
      - name: Kurulum dosyasi (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-Windows
          path: dist/*
