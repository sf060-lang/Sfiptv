name: Build IPTV Pro

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - name: APK (tek dosya, tum cihazlar)
        run: flutter build apk --release
      - name: APK (mimariye ozel, daha kucuk)
        run: flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-Android
          path: build/app/outputs/flutter-apk/*.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_platforms.sh
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Visual C++ calisma zamani DLL'lerini ekle
        run: |
          for f in msvcp140.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" build/windows/x64/runner/Release/ || true
          done
      - name: ZIP (kurulumsuz, tasinabilir)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/IPTVPro-Windows-portable.zip
      - name: Kurulum dosyasi (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\setup.iss
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-Windows
          path: dist/*

  macos:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_apple.sh
      - run: flutter pub get
      - run: flutter build macos --release
      - name: ZIP (macOS uygulamasi)
        run: |
          mkdir -p dist
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/IPTVPro-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-macOS
          path: dist/*

  ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Platform dosyalarini olustur
        run: bash tool/setup_apple.sh
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: IPA (imzasiz)
        run: |
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qr dist/IPTVPro-iOS-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: IPTVPro-iOS
          path: dist/*

  release:
    # Derlemeler bitince APK ve EXE dosyalarini "Releases" sayfasina koyar (dogrudan indirilebilir)
    needs: [android, windows, macos, ios]
    if: ${{ !cancelled() && needs.android.result == 'success' && needs.windows.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Dosyalari adlandir
        run: |
          mkdir -p release
          for f in artifacts/IPTVPro-Android/*.apk; do
            b=$(basename "$f" .apk); b=${b#app-}; b=${b%-release}
            [ "$b" = "release" ] && b="universal"
            cp "$f" "release/SF-IPTV-Player-$b.apk"
          done
          cp artifacts/IPTVPro-Windows/IPTVPro-Setup.exe release/SF-IPTV-Player-Windows-Setup.exe
          cp artifacts/IPTVPro-Windows/IPTVPro-Windows-portable.zip release/SF-IPTV-Player-Windows-portable.zip
          [ -f artifacts/IPTVPro-macOS/IPTVPro-macOS.zip ] && cp artifacts/IPTVPro-macOS/IPTVPro-macOS.zip release/SF-IPTV-Player-macOS.zip || true
          [ -f artifacts/IPTVPro-iOS/IPTVPro-iOS-unsigned.ipa ] && cp artifacts/IPTVPro-iOS/IPTVPro-iOS-unsigned.ipa release/SF-IPTV-Player-iOS-unsigned.ipa || true
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: SF İPTV Player v1.0.${{ github.run_number }}
          body: |
            **Android / Google TV / Android box:** `SF-IPTV-Player-universal.apk` (her cihazda çalışır). Telefon ve yeni kutular için `arm64-v8a` daha küçüktür; eski/32-bit kutular için `armeabi-v7a`.
            **iPhone / iPad (iOS 13+):** `SF-IPTV-Player-iOS-unsigned.ipa` imzasızdır; AltStore veya Sideloadly ile kendi Apple ID'nle kurulur. **Mac (MacBook, iMac):** `SF-IPTV-Player-macOS.zip` (Intel ve Apple Silicon).
            **Windows:** `SF-IPTV-Player-Windows-Setup.exe` (kurulum) veya `SF-IPTV-Player-Windows-portable.zip` (kurulumsuz).
          files: release/*
